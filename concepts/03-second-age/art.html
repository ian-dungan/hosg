<body><div id="wrap"><canvas id="gl" width="1600" height="900" style="visibility:hidden"></canvas><canvas id="out" width="1600" height="900"></canvas></div>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
uniform vec2 uRes;
out vec4 fragColor;

#define PI 3.14159265
const float AZ = 0.7854;
const float EL = 0.58;
const float HALFH = 17.6;
const vec3 TGT = vec3(0.0, 11.0, 0.0);
const float SK = 10.0;               // statue scale
const vec3 SPOS = vec3(0.0, 5.55, 0.0);
const float SROT = -0.62;             // statue yaw
vec3 ORB;

float h11(float n){return fract(sin(n)*43758.5453);}
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return s;}
float noise2(vec2 p){return noise(vec3(p,0.5));}

float sdBox(vec3 p, vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdCap(vec3 p, vec3 a, vec3 b, float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2){
 vec3 ba=b-a; float l2=dot(ba,ba); float rr=r1-r2; float a2=l2-rr*rr; float il2=1.0/l2;
 vec3 pa=p-a; float y=dot(pa,ba); float z=y-l2; vec3 xv=pa*l2-ba*y; float x2=dot(xv,xv);
 float y2=y*y*l2; float z2=z*z*l2; float k=sign(rr)*rr*rr*x2;
 if(sign(z)*a2*z2>k) return sqrt(x2+z2)*il2-r2;
 if(sign(y)*a2*y2<k) return sqrt(x2+y2)*il2-r1;
 return (sqrt(x2*a2*il2)+y*rr)*il2-r1;}
float sdEll(vec3 p, vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.0)/k1;}
float sdCyl(vec3 p, float r, float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.0)+length(max(d,0.0));}
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.0)/k;return min(a,b)-h*h*k*0.25;}
vec2 U(vec2 a, vec2 b){return a.x<b.x?a:b;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

// ---------------- statue figures (human scale, feet at origin, facing +z)
float felix(vec3 q){
 float d = sdEll(q-vec3(0,1.665,0.012), vec3(.102,.122,.112));
 d = smin(d, sdEll(q-vec3(0,1.705,-0.018), vec3(.112,.098,.118)), .035);
 d = smin(d, sdEll(q-vec3(0,1.58,0.06), vec3(.075,.05,.06)), .04);      // jaw
 d = smin(d, sdEll(q-vec3(0,1.655,.112), vec3(.02,.034,.03)), .015);
 d = smin(d, sdEll(q-vec3(0,1.70,.092), vec3(.08,.022,.03)), .02);
 d = smin(d, sdCap(q, vec3(0,1.47,0), vec3(0,1.6,0.01), .058), .04);
 d = smin(d, sdEll(q-vec3(0,1.31,0.01), vec3(.235,.19,.145)), .07);
 d = smin(d, sdCap(q, vec3(-.21,1.42,-.01), vec3(.21,1.42,-.01), .085), .07);
 d = smin(d, sdEll(q-vec3(0,1.09,0), vec3(.17,.16,.12)), .07);
 d = smin(d, sdRC(q, vec3(0,1.0,0), vec3(0,.66,0.0), .175, .225), .05);
 for(int i=0;i<2;i++){
  float s = i==0?-1.0:1.0;
  d = smin(d, sdRC(q, vec3(s*.1,.9,0), vec3(s*.125,.5,.03), .085,.066), .03);
  d = smin(d, sdRC(q, vec3(s*.125,.5,.03), vec3(s*.14,.1,0), .064,.05), .02);
  d = smin(d, sdBox(q-vec3(s*.14,.05,.045), vec3(.055,.045,.115))-.012, .04);
  d = smin(d, sdRC(q, vec3(s*.235,1.40,0), vec3(s*.27,1.17,.1), .072,.058), .03);
  d = smin(d, sdRC(q, vec3(s*.27,1.17,.1), vec3(s*.05,1.05,.27), .056,.045), .02);
  d = smin(d, sdEll(q-vec3(s*.045,1.04,.29), vec3(.052,.05,.058)), .02);
  d = smin(d, sdEll(q-vec3(s*.24,1.45,0), vec3(.11,.075,.11)), .02);
 }
 // cape
 float yy = clamp(1.45-q.y,0.0,1.4);
 float w = .27+.2*yy;
 float cz = -.15 - .09*yy + .025*sin(q.x*16.0+yy*3.0);
 float cape = sdBox(vec3(q.x, q.y-.8, q.z-cz), vec3(w,.66,.022))*0.7;
 d = smin(d, cape, .05);
 // sword planted
 float bl = sdBox(q-vec3(0,.52,.3), vec3(.03+0.012*(q.y), .44, .011));
 float sw = min(bl, sdBox(q-vec3(0,.965,.3), vec3(.17,.025,.035)));
 sw = min(sw, sdCap(q, vec3(0,.96,.3), vec3(0,1.1,.3), .024));
 sw = min(sw, length(q-vec3(0,1.12,.3))-.042);
 return min(d, sw);
}
float ellie(vec3 q){
 float d = sdEll(q-vec3(0,1.6,0.012), vec3(.094,.113,.104));
 d = smin(d, sdEll(q-vec3(0,1.635,-0.016), vec3(.104,.1,.112)), .03);
 d = smin(d, sdEll(q-vec3(0,1.595,.104), vec3(.017,.03,.026)), .012);
 d = smin(d, sdRC(q, vec3(0,1.6,-.06), vec3(0,1.36,-.1), .1,.075), .04);
 d = smin(d, sdRC(q, vec3(-.075,1.63,.0), vec3(-.1,1.45,-.01), .045,.03), .03);
 d = smin(d, sdRC(q, vec3(.075,1.63,.0), vec3(.1,1.45,-.01), .045,.03), .03);
 // ponytail streaming in the wind
 d = smin(d, sdRC(q, vec3(0,1.67,-.08), vec3(-.14,1.48,-.24), .055,.04), .04);
 d = smin(d, sdRC(q, vec3(-.14,1.48,-.24), vec3(-.33,1.37,-.31), .04,.012), .03);
 d = smin(d, sdCap(q, vec3(0,1.44,0), vec3(0,1.55,0.01), .046), .03);
 d = smin(d, sdEll(q-vec3(0,1.29,0.01), vec3(.165,.16,.112)), .06);
 d = smin(d, sdCap(q, vec3(-.165,1.40,0), vec3(.165,1.40,0), .062), .06);
 d = smin(d, sdEll(q-vec3(0,1.1,0), vec3(.122,.12,.092)), .06);
 // long coat flaring
 float coat = sdRC(q, vec3(0,1.1,-0.01), vec3(0.03,.42,-.06), .135, .285);
 coat = max(coat, -sdBox(q-vec3(0.0,.5,.3), vec3(.06,.4,.12))); // front split
 d = smin(d, coat, .05);
 for(int i=0;i<2;i++){
  float s = i==0?-1.0:1.0;
  d = smin(d, sdRC(q, vec3(s*.075,.9,0), vec3(s*.095,.48,.03-s*.03), .07,.056), .03);
  d = smin(d, sdRC(q, vec3(s*.095,.48,.03-s*.03), vec3(s*.11,.09,-s*.04), .054,.042), .02);
  d = smin(d, sdBox(q-vec3(s*.11,.045,.04-s*.04), vec3(.045,.04,.1))-.01, .03);
 }
 // raised outer arm with orb
 d = smin(d, sdRC(q, vec3(-.18,1.40,0), vec3(-.31,1.66,.04), .058,.048), .03);
 d = smin(d, sdRC(q, vec3(-.31,1.66,.04), vec3(-.27,1.93,.07), .046,.038), .02);
 d = smin(d, sdEll(q-vec3(-.268,1.965,.07), vec3(.048,.052,.045)), .02);
 // inner arm: hand reaching to Felix's shoulder
 d = smin(d, sdRC(q, vec3(.18,1.40,0), vec3(.34,1.27,.07), .055,.046), .03);
 d = smin(d, sdRC(q, vec3(.34,1.27,.07), vec3(.5,1.4,.04), .044,.038), .02);
 d = smin(d, sdEll(q-vec3(.52,1.415,.03), vec3(.05,.035,.05)), .02);
 return d;
}
vec3 toStatue(vec3 p){vec3 q=(p-SPOS)/SK; q.xz=rot(SROT)*q.xz; return q;}
float statue(vec3 p){
 vec3 q = toStatue(p);
 float bb = sdBox(q-vec3(0,1.05,0), vec3(.85,1.12,.55));
 if(bb>.1) return bb*SK;
 float f = felix(q-vec3(.31,0,0));
 float e = ellie((q-vec3(-.31,0,0.02))*vec3(1.0,1.03,1.0));
 float d = smin(f,e,.03);
 // base slab the heroes stand on
 d = min(d, sdBox(q-vec3(0,-.01,0.02), vec3(.72,.03,.36))-.01);
 // weathering
 d += (noise(q*38.0)-0.5)*0.004;
 return d*SK;
}
float orbD(vec3 p){return length(p-ORB)-0.72;}

// ---------------- conduits
float conduits(vec3 p){
 float r=.16; float y=.16;
 float d = sdCap(p, vec3(7.2,y,0), vec3(17,y,0), r);
 d = min(d, sdCap(p, vec3(17,y,0), vec3(17,y,11), r));
 d = min(d, sdCap(p, vec3(0,y,7.2), vec3(0,y,15), r));
 d = min(d, sdCap(p, vec3(0,y,15), vec3(-9,y,24), r));
 d = min(d, sdCap(p, vec3(-7.2,y,0), vec3(-20,y,0), r));
 d = min(d, sdCap(p, vec3(0,y,-7.2), vec3(0,y,-22), r));
 d = min(d, sdCap(p, vec3(4.9,y,4.9), vec3(13,y,13), r));
 d = min(d, sdCap(p, vec3(13,y,13), vec3(22,y,13), r));
 // climbing the plinth
 d = min(d, sdCap(p, vec3(7.1,.2,-1.6), vec3(7.1,1.1,-1.6), .14));
 d = min(d, sdCap(p, vec3(5.9,1.1,-1.6), vec3(5.9,2.1,-1.6), .14));
 d = min(d, sdCap(p, vec3(4.72,2.0,-1.6), vec3(4.72,5.1,-1.6), .14));
 d = min(d, sdCap(p, vec3(-1.6,.2,7.1), vec3(-1.6,1.1,7.1), .14));
 d = min(d, sdCap(p, vec3(-1.6,1.1,5.9), vec3(-1.6,2.1,5.9), .14));
 d = min(d, sdCap(p, vec3(-1.6,2.0,4.72), vec3(-1.6,5.1,4.72), .14));
 d = min(d, sdCap(p, vec3(4.72,5.1,-1.6), vec3(1.6,5.1,-4.72), .12));
 return d;
}

// ---------------- plinth & ruins
float plinth(vec3 p){
 float d = sdBox(p-vec3(0,.5,0), vec3(7,.5,7))-.05;
 d = min(d, sdBox(p-vec3(0,1.5,0), vec3(5.8,.5,5.8))-.05);
 float m = sdBox(p-vec3(0,3.5,0), vec3(4.6,1.9,4.6))-.05;
 // recessed panels
 m = max(m, -sdBox(vec3(abs(p.x)-4.68,p.y-3.3,p.z), vec3(.18,1.1,3.4)));
 m = max(m, -sdBox(vec3(p.x,p.y-3.3,abs(p.z)-4.68), vec3(3.4,1.1,.18)));
 d = min(d, m);
 d = min(d, sdBox(p-vec3(0,5.32,0), vec3(4.95,.24,4.95))-.04);
 // broken chunk on corner
 d = max(d, -sdBox(p-vec3(-6.6,1.2,6.6), vec3(1.6,1.0,1.2)));
 return d;
}
float pillar(vec3 p, float h, float tilt){
 float d = sdCyl(p-vec3(0,h*.5,0), .85, h*.5);
 // fluting
 float a = atan(p.z,p.x);
 d += .025*smoothstep(.3,1.0,sin(a*12.0));
 vec3 n = normalize(vec3(sin(tilt),1.0,cos(tilt*1.7)));
 d = max(d, dot(p-vec3(0,h,0), n));
 d = min(d, sdBox(p-vec3(0,.3,0), vec3(1.15,.3,1.15)));
 return d;
}
float ruins(vec3 p){
 float d = 1e5;
 float rr = length(p.xz);
 if(abs(rr-12.5)<2.5){
  for(int i=0;i<10;i++){
   float fi=float(i);
   float a = fi*0.6283+0.31;
   vec3 c = vec3(cos(a),0,sin(a))*12.5;
   float h = 2.0+8.0*h11(fi*7.3+1.0);
   if(i==1||i==7) continue;
   d = min(d, pillar(p-c, h, fi*1.3));
  }
 }
 // fallen drums
 d = min(d, sdCap(p, vec3(10.5,.75,-8.5), vec3(13.5,.75,-6.2), .78));
 d = min(d, sdCap(p, vec3(-7,.75,13.5), vec3(-10.2,.75,12.4), .78));
 // great broken arch behind
 vec3 q = p-vec3(-17,0,-17); q.xz = rot(-.785)*q.xz;
 float ar = sdBox(q-vec3(-6,6,0), vec3(1.3,6,1.3));
 ar = min(ar, sdBox(q-vec3(6,4.5,0), vec3(1.3,4.5,1.3)));
 vec2 tq = vec2(length(q.xy-vec2(0,12))-6.0, q.z);
 float tor = length(max(abs(tq)-vec2(1.2,1.2),0.0))+min(max(abs(tq.x)-1.2,abs(tq.y)-1.2),0.0);
 tor = max(tor, -(q.y-12.0));
 tor = max(tor, -(-q.x+1.0+ (q.y-12.)*0.4)); // broken right half
 ar = min(ar, tor);
 // (arch removed: confused the statue silhouette)
 // low ruined walls
 d = min(d, sdBox(p-vec3(-12,1.0,20), vec3(5,1.0+0.6*sin(p.x*.9),.7)));
 d = min(d, sdBox(p-vec3(21,1.2,-3), vec3(.7,1.2+.8*sin(p.z*.7),5)));
 return d;
}

// ---------------- dwellings
// returns vec2(dist, mat) ; mat 2 stone base, 9 plaster wall, 5 roof, 4 wood
vec2 house(vec3 p, vec3 c, vec3 b, float hb, float rh, float axis){
 vec3 q = p-c; if(axis>.5) q.xz=q.zx;
 float bound = sdBox(q-vec3(0,(hb+b.y*2.+rh)*.5,0), vec3(b.x+1.2,(hb+b.y*2.+rh)*.5+.2,b.z+1.2));
 if(bound>1.0) return vec2(bound,0);
 vec2 r = vec2(sdBox(q-vec3(0,hb*.5,0), vec3(b.x+.25,hb*.5,b.z+.25))-.08, 2.0);
 float w = sdBox(q-vec3(0,hb+b.y,0), vec3(b.x,b.y,b.z));
 r = U(r, vec2(w, 9.0));
 // timber frame beams
 float beams = sdBox(vec3(abs(q.x)-b.x, q.y-hb-b.y, abs(q.z)-b.z), vec3(.14,b.y,.14));
 beams = min(beams, sdBox(q-vec3(0,hb+.1,0), vec3(b.x+.12,.12,b.z+.12)));
 r = U(r, vec2(beams, 4.0));
 vec3 rq = q-vec3(0,hb+b.y*2.0,0);
 float sl = rh/(b.z+.6);
 float roof = max((abs(rq.z)*sl + rq.y - rh)/sqrt(sl*sl+1.0), max(-rq.y-.0, abs(rq.x)-b.x-.5));
 roof = max(roof, -((abs(rq.z)*sl + rq.y - rh+.3)/sqrt(sl*sl+1.0)) ); // shell
 roof = max(roof, -rq.y+0.0);
 r = U(r, vec2(roof, 5.0));
 // chimney
 r = U(r, vec2(sdBox(rq-vec3(b.x*.55,rh*.6,b.z*.3), vec3(.3,rh*.6,.3)), 2.0));
 return r;
}
vec2 stall(vec3 p, vec3 c, float col){
 vec3 q=p-c;
 float bound = sdBox(q-vec3(0,1.6,0), vec3(2.2,1.8,1.8));
 if(bound>1.0) return vec2(bound,0);
 vec2 r = vec2(sdBox(q-vec3(0,.55,.4), vec3(1.6,.55,.6)), 4.0);
 vec3 pq = vec3(abs(q.x)-1.6, q.y-1.4, abs(q.z)-1.1);
 r = U(r, vec2(sdBox(pq, vec3(.08,1.4,.08)), 4.0));
 vec3 cq = q-vec3(0,2.9,0); cq.yz = rot(-0.25)*cq.yz;
 float can = sdBox(cq, vec3(1.9,.04,1.5)) - .02;
 r = U(r, vec2(can, 10.0+col));
 // crates and goods
 r = U(r, vec2(sdBox(q-vec3(.9,1.25,.35), vec3(.3,.15,.25)), 4.0));
 r = U(r, vec2(length(q-vec3(-.6,1.32,.4))-.22, 12.0));
 r = U(r, vec2(length(q-vec3(-.15,1.28,.5))-.17, 12.0));
 return r;
}
vec2 walkways(vec3 p){
 // raised plank walkways between dwellings (left cluster)
 float d = sdBox(p-vec3(-17.5,4.2,6.5), vec3(.9,.1,3.2));
 d = min(d, sdBox(p-vec3(10.5,3.8,-17.0), vec3(3.3,.1,.9)));
 vec3 q = p-vec3(-17.5,2.1,6.5); q.z = abs(q.z)-2.6; q.x=abs(q.x)-.8;
 d = min(d, sdBox(q, vec3(.1,2.1,.1)));
 vec3 r = p-vec3(10.5,1.9,-17.0); r.x=abs(r.x)-2.8; r.z=abs(r.z)-.8;
 d = min(d, sdBox(r, vec3(.1,1.9,.1)));
 // rails
 d = min(d, sdBox(vec3(abs(p.x+17.5)-.85,p.y-4.9,p.z-6.5), vec3(.05,.05,3.2)));
 return vec2(d,4.0);
}
// lamp posts and lanterns
const int NL = 12;
vec3 LAMP[NL];
void initLamps(){
 LAMP[0]=vec3(9.2,3.2,-4.5); LAMP[1]=vec3(-4.5,3.2,9.2); LAMP[2]=vec3(-9.2,3.2,4.5); LAMP[3]=vec3(4.5,3.2,-9.2);
 LAMP[4]=vec3(12.2,2.7,9.4); LAMP[5]=vec3(16.6,2.7,4.6);  // stalls
 LAMP[6]=vec3(-17.5,5.6,4.0); LAMP[7]=vec3(-15.2,3.4,14.2);
 LAMP[8]=vec3(13.6,3.0,-14.6); LAMP[9]=vec3(-6.0,3.2,-19.5);
 LAMP[10]=vec3(9.55,1.4,9.15); // player's lantern
 LAMP[11]=vec3(-22.0,3.0,-6.0);
}
float lampPosts(vec3 p){
 float d=1e5;
 for(int i=0;i<4;i++){ vec3 c=LAMP[i]; d=min(d, sdCyl(p-vec3(c.x,1.4,c.z), .14, 1.4)); d=min(d, sdBox(p-vec3(c.x,.2,c.z), vec3(.35,.2,.35))); d=min(d,sdBox(p-vec3(c.x,2.85,c.z),vec3(.3,.06,.3)));}
 return d;
}
float lanterns(vec3 p){
 float d=1e5;
 for(int i=0;i<NL;i++){ if(i==10) continue; d=min(d, sdEll(p-LAMP[i], vec3(.22,.3,.22))); }
 return d;
}
// bioluminescent mushrooms (domain repetition)
vec2 shrooms(vec3 p){
 if(p.y>3.5) return vec2(p.y-3.0, 0);
 vec2 cell = floor(p.xz/3.0); vec2 lc = p.xz-(cell+.5)*3.0;
 float hh = h21(cell);
 vec2 cc = (cell+.5)*3.0; float rc=length(cc);
 bool ok = hh>.8 && rc>9.5 && rc<34.0 && abs(rc-12.5)>1.8 && abs(cc.x)>1.5 && abs(cc.y)>1.5;
 if(!ok) return vec2(1.2, 0);
 vec2 off = (vec2(h21(cell+3.1),h21(cell+7.7))-.5)*1.2;
 vec3 q = vec3(lc.x-off.x, p.y, lc.y-off.y);
 float s = .6+.9*h21(cell+1.3);
 float st = sdCap(q, vec3(0,0,0), vec3(.1*s,1.0*s,0), .08*s);
 float cap = sdEll(q-vec3(.1*s,1.0*s,0), vec3(.42,.16,.42)*s);
 vec3 q2 = q-vec3(.45*s,0,.3*s);
 st = min(st, sdCap(q2, vec3(0), vec3(-.05,.55*s,0), .05*s));
 cap = min(cap, sdEll(q2-vec3(-.05,.55*s,0), vec3(.24,.1,.24)*s));
 return U(vec2(st,11.0), vec2(cap,12.0));
}
float player(vec3 p){
 vec3 q = (p-vec3(8.7,0,8.4))/1.3;
 if(length(q-vec3(0,1,0))>1.6) return (length(q-vec3(0,1,0))-1.2)*1.3;
 q.xz = rot(-0.75)*q.xz;
 float d = sdRC(q, vec3(0,.1,0), vec3(0,1.35,0), .32, .17);      // cloak
 d = smin(d, length(q-vec3(0,1.55,-.02))-.16, .06);              // hooded head
 d = smin(d, sdEll(q-vec3(0,1.6,-.08), vec3(.19,.2,.21)), .05);
 d = min(d, sdCap(q, vec3(.25,1.25,0), vec3(.45,.9,.2), .07));   // arm with lantern

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
