<!doctype html>
<html><head><meta charset="utf-8"><title>Afterlight Key Art</title>
<style>html,body{margin:0;background:#07060d}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script>
"use strict";
// ============================================================================
//  AFTERLIGHT — target render. Lanternmere plaza at dusk, the Twin Lamps statue.
//  Pixel art is authored at 400x225 (crisp, palette-limited), upscaled x4 with
//  nearest-neighbour, then lit / bloomed / god-rayed / depth-blurred at 1600x900.
// ============================================================================
const W=400,H=225,S=4,FW=1600,FH=900;
const HOR=104;                 // sea horizon (low-res y)
const SUN={x:199,y:101,r:7};    // setting sun, framed between the two heroes
const LANTERN={x:200+(169.5-200)*1.32,y:134+(87.8-134)*1.32};  // Ellie's raised lantern (glass centre)

// ---------- utils -----------------------------------------------------------
let seed=1337; const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o=4){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);n+=a;a*=.5;f*=2.03;}return s/n;}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bayer=(x,y)=>BAY[((y&3)<<2)|(x&3)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const CC={};function col(h){if(typeof h!=='string')return h;return CC[h]||(CC[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255]);}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,255];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ---------- rasterisers (no anti-aliasing: every pixel is deliberate) -------
function rPoly(p,f){let y0=1e9,y1=-1e9;for(const q of p){y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
  for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+.5,xs=[];
    for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.ceil(xs[k]-.5);x<=Math.floor(xs[k+1]-.5);x++)f(x,y);}}
function rEll(cx,cy,rx,ry,f){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)f(x,y);}}
const rCirc=(cx,cy,r,f)=>rEll(cx,cy,r,r,f);
function rCap(x0,y0,x1,y1,r0,r1,f){const R=Math.max(r0,r1)+1,dx=x1-x0,dy=y1-y0,L2=dx*dx+dy*dy||1;
  for(let y=Math.floor(Math.min(y0,y1)-R);y<=Math.ceil(Math.max(y0,y1)+R);y++)for(let x=Math.floor(Math.min(x0,x1)-R);x<=Math.ceil(Math.max(x0,x1)+R);x++){
    const px=x+.5,py=y+.5,t=clamp(((px-x0)*dx+(py-y0)*dy)/L2,0,1),qx=x0+t*dx-px,qy=y0+t*dy-py,r=r0+(r1-r0)*t;if(qx*qx+qy*qy<=r*r)f(x,y);}}
function rLine(x0,y0,x1,y1,f){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}

class Layer{
  constructor(){this.d=new Uint8ClampedArray(W*H*4);}
  px(x,y,c,a=1){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;c=col(c);const k=(y*W+x)*4,d=this.d;
    if(a>=1){d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;return;}
    const da=d[k+3]/255,oa=a+da*(1-a);if(oa<=0)return;for(let i=0;i<3;i++)d[k+i]=(c[i]*a+d[k+i]*da*(1-a))/oa;d[k+3]=oa*255;}
  get(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return null;const k=(y*W+x)*4;return [this.d[k],this.d[k+1],this.d[k+2],this.d[k+3]];}
  al(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return 0;return this.d[(y*W+x)*4+3];}
  clr(x,y){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;this.d[(y*W+x)*4+3]=0;}
  rect(x,y,w,h,c,a){for(let j=Math.floor(y);j<y+h;j++)for(let i=Math.floor(x);i<x+w;i++)this.px(i,j,c,a);}
  poly(p,c,a){rPoly(p,(x,y)=>this.px(x,y,c,a));}
  ell(cx,cy,rx,ry,c,a){rEll(cx,cy,rx,ry,(x,y)=>this.px(x,y,c,a));}
  circ(cx,cy,r,c,a){rCirc(cx,cy,r,(x,y)=>this.px(x,y,c,a));}
  cap(x0,y0,x1,y1,r0,r1,c,a){rCap(x0,y0,x1,y1,r0,r1,(x,y)=>this.px(x,y,c,a));}
  line(x0,y0,x1,y1,c,a){rLine(x0,y0,x1,y1,(x,y)=>this.px(x,y,c,a));}
  canvas(){const c=mk(W,H);c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(this.d),W,H),0,0);return c;}
}
function sprite(L,rows,pal,x,y,E){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch==='.'||ch===' ')continue;const c=pal[ch];if(!c)continue;L.px(x+i,y+j,c);if(E&&pal._e&&pal._e.includes(ch))E.px(x+i,y+j,c);}}

const sky=new Layer(),cloud=new Layer(),far=new Layer(),sea=new Layer(),mid=new Layer(),main=new Layer(),fg=new Layer();
const eFar=new Layer(),eMid=new Layer(),eMain=new Layer(),eFg=new Layer();
const statueMask=new Uint8Array(W*H);
const LIGHTS=[]; // {x,y,r,c:[r,g,b],flat}
const light=(x,y,r,c,flat=0,k=1)=>LIGHTS.push({x,y,r,c,flat,k});

// =============================== SKY =======================================
const SKYPAL=['#100f28','#15153a','#1c1c48','#262457','#322c66','#413273','#55397d','#6b4085','#844887','#9d5186','#b55a83','#ca677e','#dc7579','#ea8a72','#f4a26c','#fbbd70','#ffd486','#ffe8a8','#fff5d2','#fffcef'].map(col);
(function(){
  for(let y=0;y<HOR;y++)for(let x=0;x<W;x++){
    const dx=x-SUN.x,dy=(y-SUN.y)*1.7,d=Math.sqrt(dx*dx+dy*dy);
    let t=Math.pow(y/HOR,1.7)*.66+.37*Math.exp(-d/80)+.22*Math.exp(-d/22)+.10*Math.exp(-(HOR-y)/5);
    t=clamp(t,0,1);const i=clamp(Math.floor(t*(SKYPAL.length-1)+bayer(x,y)-.5+.5),0,SKYPAL.length-1);
    sky.px(x,y,SKYPAL[i]);}
  // stars
  for(let i=0;i<110;i++){const x=Math.floor(rnd()*W),y=Math.floor(Math.pow(rnd(),1.6)*58);const b=rnd();
    if(Math.abs(x-SUN.x)<70&&y>30)continue;
    sky.px(x,y,b>.85?'#fff6e0':b>.5?'#c9c6f0':'#8a86c8');
    if(b>.95){sky.px(x-1,y,'#8a86c8');sky.px(x+1,y,'#8a86c8');sky.px(x,y-1,'#8a86c8');sky.px(x,y+1,'#8a86c8');}}
  // long stratus clouds: dark bellies, sun-lit rims
  const dens=(x,y)=>{const b1=Math.exp(-Math.pow((y-58)/15,2)),b2=Math.exp(-Math.pow((y-82)/6,2))*.9,b3=Math.exp(-Math.pow((y-101)/1.6,2));
    const n=fbm(x/58+3.1,y/5.2+1.7,4),n2=fbm(x/30+11,y/2.6,3);
    return Math.max(n*b1*1.15,n2*b2*1.05,(n2+.12)*b3);};
  const isC=(x,y)=>y>=0&&y<HOR&&dens(x,y)>.45;
  for(let y=26;y<HOR;y++)for(let x=0;x<W;x++){if(!isC(x,y))continue;
    const sdx=x-SUN.x,sdy=(y-SUN.y)*1.5,sd=Math.sqrt(sdx*sdx+sdy*sdy);const near=Math.exp(-sd/60);
    const below=!isC(x,y+1),above=!isC(x,y-1),below2=!isC(x,y+2);
    let c;
    if(below)c=near>.55?'#ffe3a0':near>.3?'#ffb27a':near>.15?'#ec8574':'#b8607c';
    else if(below2)c=near>.45?'#f4a070':near>.2?'#c86a78':'#8a4a7c';
    else if(above)c=near>.4?'#a4567e':'#5c3a74';
    else c=near>.45?'#7a4478':near>.2?'#5a3670':'#3e2a5e';
    sky.px(x,y,c);cloud.px(x,y,'#ffffff');}
  // sun disc (half-occluded by the thin strata above the horizon)
  rCirc(SUN.x,SUN.y,SUN.r,(x,y)=>{if(y>=HOR)return;const d=Math.hypot(x+.5-SUN.x,y+.5-SUN.y);const c=d<SUN.r-2?'#fffdf4':d<SUN.r-1?'#fff4c8':'#ffe39a';
    if(cloud.al(x,y)&&y>97){sky.px(x,y,'#ffc27a');return;}sky.px(x,y,c);eFar.px(x,y,c);});
})();

// ============================== FAR ========================================
(function(){
  // left headland + lighthouse
  far.poly([[94,HOR],[100,99],[108,97],[118,95.5],[128,96.5],[140,99.5],[152,102],[164,HOR]],'#5d4277');
  for(let x=96;x<164;x++){for(let y=94;y<HOR;y++)if(far.al(x,y)){far.px(x,y,'#9a5a7e');break;}}
  far.poly([[94,HOR],[104,101],[120,100],[134,101.5],[150,103],[160,HOR]],'#4e3a6c');
  const lx=112;
  for(let y=80;y<97;y++){const w=y<84?3:y<90?4:5;const x0=lx-Math.floor(w/2);for(let i=0;i<w;i++){const band=Math.floor((y-80)/3)%2;
    far.px(x0+i,y,i===w-1?'#5a3c66':band?'#6e3a52':'#a6869a');}}
  far.rect(lx-3,78,7,2,'#3e2c50');far.rect(lx-1,74,3,4,'#ffefb0');eFar.rect(lx-1,74,3,4,'#ffefb0');eFar.px(lx,75,'#ffffff');
  far.poly([[lx-2,74],[lx+3,74],[lx+.5,71]],'#3e2c50');
  far.rect(112,96,10,2,'#4e3a6c');far.px(118,95,'#ffd27a');eFar.px(118,95,'#ffd27a');
  // distant right isle, very faint
  far.poly([[236,HOR],[246,101],[262,100],[276,98.5],[290,100.5],[300,HOR]],'#6a4a7e');
  far.rect(270,95,2,4,'#6a4a7e');far.rect(274,93,3,6,'#6a4a7e');far.px(275,96,'#ffc87a');eFar.px(275,96,'#ffc87a');
})();

// ============================== SEA ========================================
(function(){
  const deep=col('#171c3e');
  for(let y=HOR;y<128;y++){const dy=y-HOR;
    for(let x=0;x<W;x++){
      const wob=Math.round(Math.sin(y*1.9+x*.13)*(.5+dy*.09)+Math.sin(x*.41-y*.7)*.6);
      const ry=clamp(HOR-1-Math.floor(dy*1.35),0,HOR-1);const sx=clamp(x+wob,0,W-1);
      let c=far.al(sx,ry)?far.get(sx,ry):sky.get(sx,ry);
      c=mix(c,deep,.38+dy/24*.32);
      const band=(y+Math.floor(fbm(x/9,y/1.3)*4))%3;
      if(band===0)c=mix(c,col('#ffffff'),.06);else if(band===2)c=mix(c,deep,.2);
      // quantise to keep it pixel-crisp
      c=[Math.round(c[0]/12)*12,Math.round(c[1]/12)*12,Math.round(c[2]/12)*12,255];
      sea.px(x,y,c);}}
})();

// ============================== SHIPS (mid) ================================
function ship(x0,wl,len,mh,flip){
  const T=new Layer(),TE=new Layer();
  const D='#251b2f',D2='#30243b',R='#4a3a54',SAIL='#6c5878',SAILH='#a8807e',RIG='#3d2f4b';
  T.poly([[x0-2,wl-6],[x0+len+2,wl-7],[x0+len-3,wl],[x0+3,wl]],D);
  T.rect(x0,wl-6,len,1,R);T.rect(x0+2,wl-3,len-4,1,D2);
  const cx=flip?x0+1:x0+len-11;T.rect(cx,wl-10,10,4,D2);T.rect(cx,wl-10,10,1,R);
  for(let i=0;i<len-8;i+=5){const lit=hash(x0+i,wl)>.35;const c=lit?'#ffc66a':'#3a2c40';T.px(x0+5+i,wl-4,c);if(lit)TE.px(x0+5+i,wl-4,c);}
  T.px(cx+3,wl-8,'#ffd890');TE.px(cx+3,wl-8,'#ffd890');T.px(cx+6,wl-8,'#ffd890');TE.px(cx+6,wl-8,'#ffd890');
  const masts=[[x0+len*.36,mh],[x0+len*.68,mh*.8]];
  for(const [mx0,h] of masts){const mx=Math.round(mx0),top=wl-6-h;T.rect(mx,top,1,h,D);
    for(let k=0;k<3;k++){const y=Math.round(top+4+k*h/3.4),w=Math.round(14-k*2.5);T.rect(mx-w/2,y,w,1,D);T.rect(mx-w/2+1,y+1,w-2,2,SAIL);T.rect(mx-w/2+1,y+1,w-2,1,SAILH);}
    T.line(mx,top,x0-1,wl-6,RIG);T.line(mx,top,x0+len,wl-7,RIG);
    T.poly([[mx+1,top],[mx+7,top+1.5],[mx+1,top+3]],'#a3303c');}
  const bx=flip?x0+len+2:x0-2,bd=flip?1:-1;T.line(bx,wl-6,bx+bd*9,wl-12,D);
  const lx=flip?x0+len+1:x0-1;T.px(lx,wl-12,'#ffe09a');TE.px(lx,wl-12,'#ffe09a');
  light(lx,wl-12,22,[110,70,30]);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=T.get(x,y);if(c[3]){mid.px(x,y,c);const e=TE.get(x,y);if(e[3])eMid.px(x,y,e);}}
  // reflection into the water
  for(let y=wl;y<128;y++){const sy=wl-1-Math.floor((y-wl)*1.15);for(let x=0;x<W;x++){const wob=Math.round(Math.sin(y*2.1+x*.2)*1.2);
    const c=T.get(x+wob,sy);if(c&&c[3]){const e=TE.get(x+wob,sy);const sc=sea.get(x,y);
      sea.px(x,y,e[3]&&(y+x)%2?col('#e8a860'):mix(c,sc,.45));}}}
}

// ============================== HOUSES =====================================
function win(L,E,x,y,lit,shut){
  L.rect(x-1,y-1,6,7,'#2a1c26');
  if(lit){L.rect(x,y,4,5,'#ffcf78');L.rect(x,y,4,1,'#fff0c0');L.rect(x+2,y,1,5,'#a0603a');L.rect(x,y+2,4,1,'#a0603a');
    E.rect(x,y,4,5,'#ffc870');E.rect(x,y,4,1,'#fff0c0');light(x+2,y+3,24,[170,95,30]);}
  else{L.rect(x,y,4,5,'#232746');L.px(x,y,'#4c4c7c');L.px(x+1,y,'#3a3c66');L.rect(x+2,y,1,5,'#2a1c26');L.rect(x,y+2,4,1,'#2a1c26');}
  if(shut){L.rect(x-2,y-1,1,7,shut);L.rect(x+5,y-1,1,7,shut);}
  L.rect(x-1,y+6,6,1,'#4a3026');
  for(let i=0;i<6;i++){const r=hash(x+i,y);L.px(x-1+i,y+5+(r>.5?0:-0),r>.66?'#d8506a':r>.33?'#f0b24a':'#3e6a44');}
}
function sideRoof(L,x,w,top,rh,pal){
  const pts=[[x-4,top+1],[x+w+4,top+1],[x+w+1,top-rh],[x-1,top-rh]];
  const tmp=new Layer();
  rPoly(pts,(px,py)=>{const r=(py-(top-rh))%3;let c=r===2?pal.rd:pal.r;if(r===1&&((px+Math.floor((py-top)/3)*2)%5===0))c=pal.rd;if(r===0&&hash(px,py)>.9)c=pal.rl;tmp.px(px,py,c);});
  for(let px=x-4;px<x+w+5;px++)for(let py=top-rh-1;py<top+2;py++)if(tmp.al(px,py)&&!tmp.al(px,py-1)){tmp.px(px,py,pal.rim);tmp.px(px,py+1,pal.rl);break;}
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){const c=tmp.get(px,py);if(c[3])L.px(px,py,c);}
  L.rect(x-4,top+1,w+8,1,'#1c1422');L.rect(x,top+2,w,2,'#00000000');
}
function facade(L,E,o){
  const {x,w,base,fh}=o,top=base-fh;
  L.rect(x,top,w,fh,o.wall);
  for(let j=top;j<base;j++)for(let i=x;i<x+w;i++){const n=fbm(i/3,j/3,2);if(n>.62)L.px(i,j,o.wallD);else if(n<.3)L.px(i,j,o.wallL);}
  L.rect(x,top,w,2,'#1e1626'); // eave shadow
  L.rect(x,base-7,w,7,o.stone);
  for(let j=base-7;j<base;j+=3){L.rect(x,j,w,1,'#2a2436');for(let i=x+((j/3)%2?2:5);i<x+w;i+=7)L.rect(i,j,1,3,'#2a2436');}
  const fl=o.floors,fhh=(fh-7)/fl;
  for(let f=1;f<fl;f++){const by=Math.round(top+f*fhh);L.rect(x,by,w,2,o.timber);L.rect(x,by+2,w,1,'#1e1626',.45);}
  for(const bx of o.posts||[]){const by=top+2;L.line(x+bx-6,by+Math.round(fhh)-3,x+bx,by+Math.round(fhh)-9,o.timber);L.line(x+bx+6,by+Math.round(fhh)-3,x+bx,by+Math.round(fhh)-9,o.timber);}
  L.rect(x,top,2,fh-7,o.timber);L.rect(x+w-2,top,2,fh-7,o.timber);
  for(const bx of o.posts||[])L.rect(x+bx,top,1,fh-7,o.timber);
  for(const wd of o.wins){win(L,E,x+wd[0],Math.round(top+wd[1]),wd[2],o.shut);}
}

// ============================== SKY/STAT order: build mid =================
// back houses (mid layer, hazier)
function backHouses(){
  const palL={r:'#3f3a6a',rd:'#2e2a52',rl:'#5a548a',rim:'#c88aa0'};
  facade(mid,eMid,{x:56,w:44,base:134,fh:50,wall:'#6a5a78',wallD:'#5c4e6c',wallL:'#7a6886',stone:'#4a4460',timber:'#33263a',floors:3,shut:'#3e5a6a',posts:[21],
    wins:[[6,5,true],[30,5,false],[6,19,false],[30,19,true],[14,33,true]]});
  sideRoof(mid,56,44,84,16,palL);
  mid.rect(88,64,4,8,'#3a2e44');mid.rect(87,63,6,1,'#5a4a64');
  for(let i=0;i<14;i++){mid.px(89-i*.6+Math.sin(i)*1.2,62-i,'#8a6a90',.55-i*.035);}
  const palR={r:'#6a3a48',rd:'#4e2a3a',rl:'#8a5260',rim:'#e09a8a'};
  facade(mid,eMid,{x:300,w:46,base:134,fh:48,wall:'#6e5c74',wallD:'#5e4e66',wallL:'#7e6a82',stone:'#4a4460',timber:'#33263a',floors:3,shut:'#7a3a3a',posts:[23],
    wins:[[6,5,false],[33,5,true],[6,19,true],[33,19,true],[14,33,false]]});
  sideRoof(mid,300,46,86,18,palR);
  mid.rect(306,66,4,9,'#3a2e44');mid.rect(305,65,6,1,'#5a4a64');
}

// ============================== QUAY (main) ================================
function quay(){
  main.rect(88,121,224,2,'#9a8aa2');main.rect(88,123,224,4,'#4a4460');main.rect(88,121,224,1,'#c6a2a6');

function floor(){
  const PAL=[['#211e2e','#2f2b42','#3c3753','#4b4562'],['#231f30','#342f47','#433c58','#544b69'],['#201d2c','#2c2a40','#38354e','#46425e'],['#262030','#3a3248','#4a4058','#5a4e66']];
  main.rect(0,127,W,H-127,'#1c1928');
  const pts=[];let yy=125,row=0;
  while(yy<H+10){const sx=4.2+(yy-127)*.085,sy=sx*.56;for(let x=-sx;x<W+sx;x+=sx){const xi=Math.round(x*10);
      pts.push([x+(hash(xi,row)-.5)*sx*.8+(row%2)*sx*.5,yy+(hash(row,xi)-.5)*sy*.7,sx,sy,hash(xi,row*3+1)]);}yy+=sy;row++;}
  for(let py=127;py<H;py++){const cand=pts.filter(p=>Math.abs(p[1]-py)<12);
    for(let px=0;px<W;px++){let d1=1e9,d2=1e9,b=null;
      for(const p of cand){const dx=px+.5-p[0],dy=(py+.5-p[1])/.56,d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d;b=p;}else if(d<d2)d2=d;}
      const gap=Math.sqrt(d2)-Math.sqrt(d1);if(gap<.9+b[2]*.06)continue;
      const pal=PAL[Math.floor(b[4]*4)];const ry=(py+.5-b[1])/b[3],rx=(px+.5-b[0])/b[2];
      let i=1;if(ry<-.18&&gap>1.4)i=3;else if(ry<.05)i=2;else if(ry>.32||gap<1.5)i=0;if(rx<-.3&&i===1)i=2;
      if(hash(px,py)>.97)i=Math.max(0,i-1);main.px(px,py,pal[i]);}}
  // processional path towards the statue
  for(let yy=188;yy<H;yy++){const t=(yy-188)/37,hw=16+t*14;for(let x=Math.floor(200-hw);x<200+hw;x++){
    const rowH=4+Math.floor(t*3),ry=(yy-188)%rowH,cw=10+Math.floor(t*5),cx=(x+((Math.floor((yy-188)/rowH))%2)*Math.floor(cw/2)+400)%cw;
    let c='#5e5872';if(ry===0)c='#78708a';else if(ry===rowH-1||cx===0)c='#2c283a';if(Math.abs(x-200)>=hw-1)c='#2c283a';main.px(x,yy,c);}}
  // mosaic ring around the plinth
  const rcx=200,rcy=171,rx=92,ry=21;
  for(let yy=146;yy<196;yy++)for(let x=100;x<300;x++){const e=Math.hypot((x+.5-rcx)/rx,(yy+.5-rcy)/ry);
    if(e<1&&e>.86){const a=Math.atan2((yy-rcy)/ry,(x-rcx)/rx);const seg=Math.floor((a+Math.PI)/(Math.PI*2)*48);
      let c=seg%2?'#7a6c86':'#6a5e7a';if(e>.97||e<.885)c='#2c283a';else if(seg%6===0)c='#a08a6a';main.px(x,yy,c);}
    else if(e<=.86&&e>.80){main.px(x,yy,'#3a3550');}}
}

function sculpt(){
  buildStatue();
  const idMap=new Int16Array(W*H).fill(-1);
  const X0=140,X1=262,Y0=22,Y1=140;
  SP.forEach((p,k)=>{p.m=new Float32Array(W*H);p.fn((x,y)=>{if(x<X0||x>=X1||y<Y0||y>=Y1)return;p.m[y*W+x]=1;idMap[y*W+x]=k;});
    // two box-blur passes -> soft height field -> fake normals
    let a=p.m;for(let pass=0;pass<2;pass++){const b=new Float32Array(W*H);
      for(let y=Y0;y<Y1;y++)for(let x=X0;x<X1;x++){let s=0;for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)s+=a[(y+j)*W+x+i];b[y*W+x]=s/25;}a=b;}
    p.b=a;});
  const RAMP=['#141220','#1e1b2c','#2a263b','#38324b','#48405c','#5c516e','#75677f','#93808f','#b49a98','#d4b49e','#ecceaa','#fbe4bc'].map(col);
  const MRAMP=['#2a1e1a','#4a3424','#6e4e2e','#9a6e38','#c89848','#e8c068','#fae49a','#fff8e0'].map(col);
  const norm=(x,y,p)=>{const b=p.b;let nx=-(b[y*W+x+1]-b[y*W+x-1])*2.2,ny=-(b[(y+1)*W+x]-b[(y-1)*W+x])*2.2;const l=Math.hypot(nx,ny);if(l>.92){nx*=.92/l;ny*=.92/l;}return [nx,ny,Math.sqrt(1-nx*nx-ny*ny)];};
  for(let y=Y0;y<Y1;y++)for(let x=X0;x<X1;x++){const k=idMap[y*W+x];if(k<0)continue;const p=SP[k];statueMask[y*W+x]=1;
    if(p.kind==='glass'){const g=(y<=LANTERN.y-2)?'#fffbe8':(Math.abs(x+.5-LANTERN.x)>2.4)?'#ffc35a':'#ffe7a0';main.px(x,y,g);eMain.px(x,y,g);continue;}
    const n=norm(x,y,p);
    // key: Ellie's lantern (point), fill: braziers below-front, top: cool sky, back: sun
    let vx=LANTERN.x-(x+.5),vy=LANTERN.y-(y+.5),vz=7;const d=Math.hypot(vx,vy,vz);
    let s=.03;
    s+=Math.max(0,(n[0]*vx+n[1]*vy+n[2]*vz)/d)*1.25/(1+d*d/500);
    s+=Math.max(0,n[1]*.55+n[2]*.83)*.36*clamp((y-70)/60,.1,1);
    s+=Math.max(0,-n[1]*.8+n[2]*.6)*.07;
    let idx;
    if(p.kind==='metal'){s+=.15+Math.max(0,-n[0])*.4;idx=clamp(Math.floor(s*7+bayer(x,y)-.5),0,7);}
    else{if(p.kind==='shield')s*=.92;if(p.kind==='hair')s=s*.42-.03;if(p.kind==='boss')s+=.2;idx=clamp(Math.floor(s*11.5+(bayer(x,y)-.5)*.45+.5),0,11);}
    let c=p.kind==='metal'?MRAMP[idx]:RAMP[idx];
    // edges: rim light from the sun behind them, overlap lines between parts
    let rim=0,over=false;const sx=SUN.x-x,sy=SUN.y-y,sl=Math.hypot(sx,sy)||1;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const q=idMap[(y+dy)*W+x+dx];
      if(q<0){const facing=(dx*sx+dy*sy)/sl;const bc=sky.get(x+dx,y+dy);const lum=bc?(bc[0]*.5+bc[1]*.4+bc[2]*.1)/255:0;
        if(facing>.15)rim=Math.max(rim,lum*(.35+facing*.65));}
      else if(q<k&&SP[q].kind!=='glass'&&!(p.kind==='stone'&&SP[q].kind==='stone'&&Math.abs(q-k)===1&&false))over=true;}
    if(over){const i=Math.max(0,RAMP.indexOf(c)-2);c=p.kind==='metal'?MRAMP[Math.max(0,MRAMP.indexOf(c)-2)]:RAMP[i];}
    if(rim>.62)c=col('#fff3cc');else if(rim>.48)c=col('#ffcf8e');else if(rim>.36)c=col('#d88a7a');
    main.px(x,y,c);if(rim>.48)eMain.px(x,y,c);}
  light(LANTERN.x,LANTERN.y,70,[120,80,30]);light(214,112,46,[90,55,25]);light(LANTERN.x,LANTERN.y,22,[110,80,40]);
}
