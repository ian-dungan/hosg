<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HUD harness · Shady Grove 2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #479AF2; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #dev { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; display: none; flex-wrap: wrap; gap: 4px; max-width: 360px;
    padding: 8px; border-radius: 10px; background: rgba(0,0,0,.65); font: 12px system-ui, sans-serif; }
  #dev.open { display: flex; }
  #dev button { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; background: #fff; }
  #devtoggle { position: fixed; left: 50%; top: 4px; transform: translateX(-50%); z-index: 11; font: 11px system-ui; padding: 3px 8px; border-radius: 6px; border: 0; opacity: .6; }
  .clean #devtoggle { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<button id="devtoggle">dev</button>
<div id="dev"></div>
<script type="module" src="/src/hud/dev.ts"></script>
</body>
</html>
